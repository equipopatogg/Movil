build:
  maxIssues: 0
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'
complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
