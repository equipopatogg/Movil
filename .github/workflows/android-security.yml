name: Android security control
on:
  workflow_call:
    inputs:
      scanner:
        required: true
        type: string
permissions:
  contents: read
jobs:
  scan:
    name: ${{ inputs.scanner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
        if: inputs.scanner == 'trivy'
      - name: Release runtime SBOM
        if: inputs.scanner == 'trivy'
        run: bash ./gradlew :app:cyclonedxDirectBom --no-configuration-cache --console=plain
      - name: Gitleaks
        id: gitleaks
        if: ${{ always() && inputs.scanner == 'gitleaks' }}
        run: python3 .github/scripts/android-evidence.py scan gitleaks
      - name: Semgrep
        id: semgrep
        if: ${{ always() && inputs.scanner == 'semgrep' }}
        run: python3 .github/scripts/android-evidence.py scan semgrep
      - name: SCA release SBOM
        id: trivy
        if: ${{ always() && inputs.scanner == 'trivy' }}
        run: python3 .github/scripts/android-evidence.py scan trivy
      - name: Validate scanner evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          SCANNER: ${{ inputs.scanner }}
        run: python3 .github/scripts/android-evidence.py summary "$SCANNER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-${{ inputs.scanner == 'trivy' && 'dependencies' || inputs.scanner == 'gitleaks' && 'secrets' || 'sast' }}
          path: |
            artifacts/android-security/
            app/build/reports/cyclonedx-direct/
          if-no-files-found: error
          retention-days: 7
