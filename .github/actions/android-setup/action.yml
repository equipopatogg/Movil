name: Android toolchain
description: Existing pinned JDK, Wrapper validation, Gradle and Android SDK; no publication.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        validate-wrappers: true
        allow-snapshot-wrappers: false
        cache-provider: basic
        cache-read-only: true
        dependency-graph: disabled
    - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
      with:
        packages: platforms;android-36.1 build-tools;36.0.0
        log-accepted-android-sdk-licenses: false
